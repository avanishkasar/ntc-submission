name: Daily Auto Commit

on:
  schedule:
    # Runs every day at 5:00 AM UTC = 10:30 AM IST
    - cron: '0 5 * * *'
  workflow_dispatch: # Also allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set git identity
        run: |
          git config user.name "avanishkasar"
          git config user.email "avanishkasar@gmail.com"

      - name: Run auto-commit engine
        run: python .github/scripts/gha_commit.py

      - name: Push commits
        run: git push origin main
